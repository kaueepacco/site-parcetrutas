<!-- ===== GALERIA ===== -->

<h2 class="h2-galeria">Galeria de Fotos</h2>
<section class="gallery-carousel">
  <div class="gallery-track">
    <div class="gallery-item active">
      <img src="inc/images/foto1.jpeg" alt="Foto 1">
    </div>
    <div class="gallery-item">
      <img src="inc/images/foto2.jpeg" alt="Foto 2">
    </div>
    <div class="gallery-item">
      <img src="inc/images/foto3.jpeg" alt="Foto 3">
    </div>
  </div>

  <div class="gallery-controls">
    <span class="gallery-prev">❮</span>
    <span class="gallery-next">❯</span>
  </div>
</section><br><br>
<h2 class="h2-galeria">Galeria de Vídeos</h2>
<section class="video-carousel">
  <div class="video-track">
    <div class="video-item active">
      <video src="inc/videos/video1.mp4" preload="metadata" controls></video>
    </div>
    <div class="video-item">
      <video src="inc/videos/video2.mp4" preload="metadata" controls></video>
    </div>
    <div class="video-item">
      <video src="inc/videos/video3.mp4" preload="metadata" controls></video>
    </div>
  </div>

  <div class="video-controls">
    <span class="video-prev">❮</span>
    <span class="video-next">❯</span>
  </div>
</section>
