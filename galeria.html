<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria de Fotos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="titulo">🔥 Parcetrutas</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="eventos.html">Eventos</a>
      <a href="galeria.html">Galeria</a>
      <a href="parcetrutas.html">Participantes</a>
    </nav>

    <div class="menu-toggle" id="menu-toggle">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>
<!-- ===== GALERIA ===== -->
  <section class="galeria">
    <h2>Galeria de Fotos</h2>
    <div class="grid-galeria">
      <img src="inc/images/foto8.jpeg">
      <img src="inc/images/foto7.jpeg">
      <img src="inc/images/foto6.jpeg">
      <img src="inc/images/foto1.jpeg">
      <img src="inc/images/foto2.jpeg">
      <img src="inc/images/foto3.jpeg">
      <img src="inc/images/foto4.jpeg">
      <img src="inc/images/foto5.jpeg">
    </div>
  </section>

  <!-- ===== MODAL ===== -->
  <div class="modal" id="modal">
    <span id="fechar">&times;</span>
    <img id="imgModal" src="" alt="Foto ampliada">
  </div>

  <script>
    // Menu hamburguer
    const menuToggle = document.getElementById("menuToggle");
    const menu = document.getElementById("menu");

    menuToggle.addEventListener("click", () => {
      menu.classList.toggle("ativo");
    });

    // ===== MODAL =====
    const imagens = document.querySelectorAll(".grid-galeria img");
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("imgModal");
    const fechar = document.getElementById("fechar");

    imagens.forEach(img => {
      img.addEventListener("click", () => {
        modal.style.display = "flex";
        modalImg.src = img.src;
        modalImg.alt = img.alt;
      });
    });

    fechar.addEventListener("click", () => {
      modal.style.display = "none";
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.style.display = "none";
    });
  </script>
</body>
</html>
  
  <script src="script.js"></script>
  </body>

  </html>
